[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
    knolleary/PubSubClient@^2.8
    https://github.com/MyTurnyet/mcs-core.git#v0.1.0
    https://github.com/MyTurnyet/mcs-net.git#v0.3.0
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:native]
platform = native
test_framework = custom
test_build_src = false
build_flags = -std=c++17 -Ilib/McsCore/src
lib_deps =
    https://github.com/MyTurnyet/mcs-core.git#v0.1.0
    https://github.com/MyTurnyet/mcs-net.git#v0.3.0
